<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tarih Bilgi Yarışması - History Quiz Master</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Tone.js for Audio Synth and Sound Effects -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        aurora: {
                            bg: '#0B0F19',
                            card: 'rgba(23, 31, 51, 0.75)',
                            border: 'rgba(255, 255, 255, 0.12)',
                            primary: '#6366f1',
                            accent: '#a855f7',
                            neon: '#06b6d4',
                            emerald: '#10b981',
                            rose: '#f43f5e'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap');
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #0b0f19;
            color: #f3f4f6;
            overflow-x: hidden;
        }
        .aurora-bg {
            background: radial-gradient(circle at 10% 20%, rgba(99, 102, 241, 0.25) 0%, transparent 40%),
                        radial-gradient(circle at 90% 80%, rgba(168, 85, 247, 0.2) 0%, transparent 40%),
                        radial-gradient(circle at 50% 50%, rgba(6, 182, 212, 0.15) 0%, transparent 60%);
        }
        .glass-panel {
            background: rgba(23, 31, 51, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.12);
        }
        .glass-btn {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.25s ease;
        }
        .glass-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.3);
            transform: translateY(-2px);
        }
    </style>
</head>
<body class="aurora-bg min-h-screen flex flex-col justify-between selection:bg-indigo-500 selection:text-white">

    <!-- HEADER -->
    <header class="w-full p-4 md:px-8 border-b border-gray-800/80 glass-panel sticky top-0 z-40">
        <div class="max-w-7xl mx-auto flex justify-between items-center">
            <div class="flex items-center space-x-3 cursor-pointer" onclick="showScreen('welcome')">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-indigo-500 via-purple-500 to-cyan-400 p-0.5 flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <div class="w-full h-full bg-slate-950 rounded-[10px] flex items-center justify-center">
                        <i class="fa-solid font-bold fa-landmark text-transparent bg-clip-text bg-gradient-to-tr from-indigo-400 to-cyan-300"></i>
                    </div>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg md:text-xl tracking-tight text-white leading-none">
                        HISTORIA <span class="text-cyan-400 text-xs px-2 py-0.5 rounded-full bg-cyan-950/80 border border-cyan-500/30 font-semibold">AURORA</span>
                    </h1>
                    <p class="text-[11px] text-gray-400 font-medium" data-i18n="tagline">Tarih Bilgi Yarışması</p>
                </div>
            </div>

            <div class="flex items-center space-x-3 md:space-x-4">
                <button onclick="openAvatarModal()" class="flex items-center space-x-2 glass-btn px-3 py-1.5 rounded-full hover:border-cyan-400/50 transition">
                    <div id="headerAvatar" class="w-8 h-8 rounded-full bg-indigo-600/50 border border-cyan-400/40 flex items-center justify-center text-lg shadow-inner">
                        🧙‍♂️
                    </div>
                    <span id="headerUsername" class="text-xs md:text-sm font-semibold text-gray-200 max-w-[90px] md:max-w-[140px] truncate">Tarihçi</span>
                    <i class="fa-solid fa-pen text-[10px] text-cyan-400"></i>
                </button>

                <button onclick="openSettingsModal()" class="glass-btn w-10 h-10 rounded-full flex items-center justify-center text-gray-300 hover:text-cyan-400 transition" title="Settings / Ayarlar">
                    <i class="fa-solid fa-gear text-lg"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONTAINER -->
    <main class="flex-grow max-w-5xl w-full mx-auto p-4 md:p-6 flex items-center justify-center">
        <!-- WELCOME SCREEN -->
        <section id="welcomeScreen" class="w-full max-w-2xl glass-panel rounded-3xl p-6 md:p-10 shadow-2xl relative overflow-hidden my-auto">
            <div class="text-center space-y-4 mb-8">
                <span class="px-3 py-1 rounded-full text-xs font-semibold bg-indigo-500/10 border border-indigo-500/20 text-indigo-300 inline-block" data-i18n="badgeWelcome">
                    ✨ Dünya Tarihini Keşfet
                </span>
                <h2 class="text-3xl md:text-4xl font-extrabold text-white tracking-tight" data-i18n="mainTitle">
                    Tarih Bilgini Test Et
                </h2>
            </div>

            <div class="space-y-6">
                <!-- Select Question Count -->
                <div class="space-y-2">
                    <label class="text-xs font-bold uppercase tracking-wider text-gray-400 flex items-center space-x-2">
                        <i class="fa-solid fa-list-ol text-cyan-400"></i>
                        <span data-i18n="selectQuestionCount">Soru Sayısı Seçimi</span>
                    </label>
                    <div class="grid grid-cols-4 gap-2 md:gap-3">
                        <button onclick="setQuestionCount(20)" id="qBtn20" class="q-count-btn glass-btn py-3 rounded-xl font-bold text-sm text-center border-indigo-500/50 bg-indigo-500/20 text-cyan-300">20</button>
                        <button onclick="setQuestionCount(50)" id="qBtn50" class="q-count-btn glass-btn py-3 rounded-xl font-bold text-sm text-center text-gray-300">50</button>
                        <button onclick="setQuestionCount(100)" id="qBtn100" class="q-count-btn glass-btn py-3 rounded-xl font-bold text-sm text-center text-gray-300">100</button>
                        <button onclick="setQuestionCount(200)" id="qBtn200" class="q-count-btn glass-btn py-3 rounded-xl font-bold text-sm text-center text-gray-300">200</button>
                    </div>
                </div>

                <button onclick="startGame()" class="w-full py-4 rounded-2xl bg-gradient-to-r from-indigo-600 via-purple-600 to-cyan-500 font-extrabold text-white text-lg shadow-xl transition transform active:scale-[0.98]">
                    Yarışmayı Başlat
                </button>
            </div>
        </section>
    </main>

    <footer class="w-full p-4 text-center text-xs text-gray-500 border-t border-gray-800/50 glass-panel">
        <p>© 2026 Historia Aurora Quiz</p>
    </footer>

    <script>
        let targetQuestionCount = 20;
        function setQuestionCount(count) {
            targetQuestionCount = count;
        }
        function startGame() {
            alert(targetQuestionCount + " soruluk yarışma başlatılıyor!");
        }
    </script>
</body>
</html>
